<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F14; }
      .panel { fill: #131A22; stroke: #1E2A36; stroke-width: 1.5; rx: 8px; }
      .inner-panel { fill: #0E141C; stroke: #1E2A36; stroke-width: 1; rx: 6px; }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
      .title { font-size: 14px; font-weight: 600; fill: #E6EDF3; }
      .meta { font-size: 12px; fill: #7D8B99; }
      .score-box { font-size: 15px; font-weight: 700; fill: #E5484D; }
      .beacon { fill: #FF6A3D; }
      .bullet-text { font-size: 12.5px; fill: #C9D1D9; }
      .bullet-crit { font-size: 11px; font-weight: 600; fill: #E5484D; }
      .bullet-high { font-size: 11px; font-weight: 600; fill: #F5A524; }
      .bullet-tag { font-size: 11px; fill: #7D8B99; }
      .footer-text { font-size: 11px; fill: #6E7681; }
      .code-inline { fill: #FF7B72; font-size: 12px; }
      .pill { rx: 4px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="880" height="440" class="bg" rx="10"/>

  <!-- PR Comment Card Container -->
  <g transform="translate(40, 30)">
    <!-- Main Card Body -->
    <rect width="800" height="380" class="panel"/>

    <!-- Header / Bot Attribution -->
    <circle cx="36" cy="34" r="14" fill="#1E2A36"/>
    <circle cx="36" cy="34" r="6" class="beacon"/>
    <text x="62" y="32" class="sans title">github-actions <tspan font-weight="400" fill="#7D8B99">bot commented on PR #412</tspan></text>
    <text x="62" y="47" class="sans meta">runtime syscall telemetry from <tspan class="mono" fill="#E6EDF3">installscope record -- npm install</tspan></text>

    <!-- Divider -->
    <line x1="20" y1="66" x2="780" y2="66" stroke="#1E2A36" stroke-width="1.5"/>

    <!-- Score Header -->
    <g transform="translate(24, 88)">
      <circle cx="10" cy="10" r="6" fill="#E5484D"/>
      <text x="24" y="15" class="mono score-box">100 / 100 <tspan font-size="13px" font-weight="400" fill="#7D8B99">(raw score 220)</tspan> <tspan font-weight="400" fill="#7D8B99">·</tspan> <tspan font-size="13px" font-weight="400" fill="#E6EDF3">event-stream: complete (1,771 syscalls recorded)</tspan></text>
    </g>

    <!-- Findings Box -->
    <g transform="translate(24, 126)">
      <rect width="752" height="175" class="inner-panel"/>

      <!-- Finding 1 -->
      <g transform="translate(20, 32)">
        <circle cx="4" cy="4" r="3" fill="#E5484D"/>
        <text x="16" y="8" class="sans bullet-text">
          Wrote outside expected project/cache directories:
          <tspan class="mono" fill="#FF7B72">/etc/cron.d/persistence</tspan>
        </text>
        <rect x="635" y="-5" width="58" height="18" fill="#321417" class="pill"/>
        <text x="643" y="8" class="mono bullet-crit">CRITICAL</text>
      </g>

      <!-- Finding 2 -->
      <g transform="translate(20, 68)">
        <circle cx="4" cy="4" r="3" fill="#E5484D"/>
        <text x="16" y="8" class="sans bullet-text">
          Piped downloaded remote payload to shell:
          <tspan class="mono" fill="#FF7B72">sh -c "curl -fsSL ... | sh"</tspan>
        </text>
        <rect x="635" y="-5" width="58" height="18" fill="#321417" class="pill"/>
        <text x="643" y="8" class="mono bullet-crit">CRITICAL</text>
      </g>

      <!-- Finding 3 -->
      <g transform="translate(20, 104)">
        <circle cx="4" cy="4" r="3" fill="#F5A524"/>
        <text x="16" y="8" class="sans bullet-text">
          Contacted non-registry external IP during install:
          <tspan class="mono" fill="#FF7B72">198.51.100.42:4444</tspan>
        </text>
        <rect x="655" y="-5" width="38" height="18" fill="#2E2012" class="pill"/>
        <text x="663" y="8" class="mono bullet-high">HIGH</text>
      </g>

      <!-- Trailing note -->
      <g transform="translate(20, 142)">
        <text x="16" y="8" class="sans meta">▸ …and 8 more observed findings captured in full forensic trace</text>
      </g>
    </g>

    <!-- Action links & Evidence artifacts -->
    <g transform="translate(24, 324)">
      <text x="0" y="0" class="mono" font-size="12px" fill="#FF6A3D">
        <tspan font-weight="600">[view full evidence report (.html) ↗]</tspan>
        <tspan fill="#7D8B99"> · </tspan>
        <tspan font-weight="600">[download SARIF ↗]</tspan>
        <tspan fill="#7D8B99"> · </tspan>
        <tspan fill="#7D8B99">events.jsonl (sha256:e3b0c442...)</tspan>
      </text>
    </g>

    <!-- Footer note -->
    <g transform="translate(24, 354)">
      <text x="0" y="0" class="sans footer-text">
        Recorded with the strace engine (v1.0). Advisory: this comment reports observed install behaviors, and does not block the build.
      </text>
    </g>
  </g>
</svg>

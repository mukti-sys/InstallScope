name: harness tests

# Cheap, always-on verification of the G2 parser/classifier/aggregator, plus the repo-wide
# banned-language check. Pure Node, no Linux privileges, no third-party installs — so it can safely
# run on every push, unlike the gates themselves (which install arbitrary packages and need sudo).
#
# Rules.md §6 requires golden fixtures for rules changes. This is where they run.

on:
  push:
    paths:
      - "harness/g2/**"
      - "core/**"
      - "lockfile/**"
      - "recorder/**"
      - "registry/**"
      - "report/**"
      - "cli/**"
      - "action/**"
      - ".github/workflows/harness-tests.yml"
  pull_request:
    paths:
      - "harness/g2/**"
      - "core/**"
      - "lockfile/**"
      - "recorder/**"
      - "registry/**"
      - "report/**"
      - "cli/**"
      - "action/**"
      - ".github/workflows/harness-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden:
    name: G2 golden tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Parser + classifier + aggregator golden tests
        run: node harness/g2/test-parse.mjs

      - name: Shell syntax check
        run: bash -n harness/g2/record-package.sh

      - name: Banned-language check
        # Rules.md §4: "protection", "sandbox", "safe", "guaranteed" etc. must not appear as product
        # framing. Checked mechanically because it is the kind of rule that erodes silently.
        #
        # Covers product code as well as the harness: the framing matters most in the crate docs a
        # reader actually sees. Whole words only; lines that discuss the ban itself are excluded, as
        # is this workflow.
        #
        # `safe` is deliberately absent from the pattern. It has a legitimate technical meaning this
        # codebase uses constantly — "safe Rust", "JSON's safe integer range", "safe by construction" —
        # and banning the word rather than the framing would produce a check people route around. The
        # framing it appears in is what matters, and that is a review judgement.
        run: |
          set -uo pipefail
          hits="$(
            grep -rniE '\b(sandbox|sandboxed|sandboxing|protection|protects?|guaranteed|security blanket)\b' \
              --include='*.md' --include='*.mjs' --include='*.sh' --include='*.rs' --include='*.yml' \
              --include='*.toml' --exclude='harness-tests.yml' \
              harness .github core lockfile recorder registry report cli action 2>/dev/null \
              | grep -viE 'banned|Rules\.md|never .?(protection|sandbox)|not (a )?(sandbox|protection)|opt-in enforcement' \
              || true
          )"
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error title=Banned language::Rules.md §4 bans these words as product framing. Use evidence/records/observe/forensic/audit instead."
            exit 1
          fi
          echo "no banned framing found"

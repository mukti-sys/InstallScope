name: rust

# Phase 1 product code CI. Cheap and always-on: no sudo, no third-party package installs, no
# untrusted install scripts. The gate workflows stay workflow_dispatch-only for those reasons; this
# one runs on every push because Rules.md §6 requires `cargo fmt` + `clippy -D warnings` clean and
# that is only true if it is checked.
#
# Rules.md §2 additionally bans .unwrap()/.expect() in non-test code. The crates deny those lints
# internally via #![cfg_attr(not(test), deny(...))], so clippy here enforces it rather than a grep.

on:
  push:
    paths:
      - "abi/**"
      - "core/**"
      - "recorder/**"
      - "cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "abi/**"
      - "core/**"
      - "recorder/**"
      - "cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Restores ~/.cargo and target/. Without it every push rebuilds the whole dependency tree,
      # which is most of the job's runtime.
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # --all-targets so tests are linted too; the golden fixtures are where correctness lives.
        #
        # `-D warnings` is passed to clippy rather than set as a global RUSTFLAGS env var on purpose:
        # RUSTFLAGS applies to dependency compilation as well, so a warning in any upstream crate
        # would fail this build for reasons unrelated to our code.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # No strace needed. Every test that touches a real process is both #[ignore]d and
        # #![cfg(target_os = "linux")]; those run in phase1-e2e.yml, which installs strace.
        run: cargo test --workspace --all-targets

      - name: cargo clippy (aya backend)
        # The aya backend is feature-gated, so the default clippy run above never sees it. Without this
        # step, a warning in recorder/src/aya.rs would only surface on the Phase 2 workflow — which is
        # manual-dispatch only, so it could sit unnoticed for days.
        #
        # This lints the loader, not the eBPF programs: those need nightly plus bpfel-unknown-none and
        # are built in phase2-aya.yml.
        run: cargo clippy --workspace --all-targets --features installscope/aya-backend -- -D warnings

      - name: cargo test (aya backend)
        run: cargo test --workspace --features installscope/aya-backend

      - name: Verify the no-unwrap rule covers non-test code
        # Belt and braces over the crate-level lints: a future `#[allow]` would silence clippy
        # locally without anyone noticing. This catches the attribute itself.
        run: |
          set -uo pipefail
          hits="$(grep -rn 'allow(clippy::unwrap_used\|allow(clippy::expect_used' \
            abi/src core/src recorder/src cli/src 2>/dev/null || true)"
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error title=Rules.md §2::unwrap/expect lints must not be allowed in product code"
            exit 1
          fi
          echo "no unwrap/expect allow-attributes in product code"

      - name: Verify unsafe stays confined to the eBPF boundary
        # recorder/src/lib.rs uses deny(unsafe_code) rather than forbid, so recorder/src/aya.rs can opt
        # in: reading a #[repr(C)] record out of an untyped perf-buffer slice has no safe equivalent.
        # That exception must stay one module wide. A second `allow(unsafe_code)` appearing elsewhere is
        # exactly the drift this catches.
        run: |
          set -uo pipefail
          hits="$(grep -rln 'allow(unsafe_code)' abi/src core/src recorder/src cli/src 2>/dev/null || true)"
          expected="recorder/src/aya.rs"
          if [ "$hits" != "$expected" ] && [ -n "$hits" ]; then
            printf 'files opting into unsafe:\n%s\n' "$hits"
            echo "::error title=Unsafe boundary::only $expected may allow unsafe_code; see its module docs for why"
            exit 1
          fi
          echo "unsafe is confined to ${hits:-nothing}"

      - name: Confirm the dependency tree has no LLM, cloud, or telemetry crates
        # Rules.md §1 bans these outright: "this product's entire moral claim is 'we watch packages,
        # not people.'" Checked mechanically because a transitive dependency could introduce one
        # without a visible manifest change.
        run: |
          set -uo pipefail
          cargo tree --workspace --edges normal --prefix none --format '{p}' \
            | sort -u > /tmp/deps.txt
          echo "--- resolved dependency set ---"
          cat /tmp/deps.txt
          banned='openai|anthropic|langchain|aws-sdk|azure_|google-cloud|sentry|datadog|opentelemetry|posthog|segment|mixpanel|amplitude'
          if grep -Eiq "^($banned)" /tmp/deps.txt; then
            grep -Ei "^($banned)" /tmp/deps.txt
            echo "::error title=Rules.md §1::banned dependency category present in the tree"
            exit 1
          fi
          echo "dependency tree is clean"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate TESTS.md and fail if it is stale
        # TESTS.md is generated, and a generated file that drifts is worse than no file: it looks
        # authoritative while being wrong. Regenerating here and diffing means the committed counts are
        # always what the suite actually produced.
        #
        # The generator runs the full suite again, which is a few seconds and buys the guarantee that the
        # numbers in the repo were not typed by hand.
        run: |
          set -uo pipefail
          cp TESTS.md /tmp/TESTS.md.committed 2>/dev/null || touch /tmp/TESTS.md.committed
          node scripts/test-log.mjs
          # The timestamp line differs on every run by design, so it is excluded from the comparison.
          if ! diff <(grep -v '^- Generated:' /tmp/TESTS.md.committed) \
                    <(grep -v '^- Generated:' TESTS.md) > /tmp/tests-diff.txt; then
            cat /tmp/tests-diff.txt
            echo "::error title=TESTS.md is stale::Run \`node scripts/test-log.mjs\` and commit the result."
            exit 1
          fi
          echo "TESTS.md matches the suite"

  cross-check:
    name: build the recorder for linux release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --workspace --release

      - name: Confirm the binary runs and reports its version
        run: |
          set -euo pipefail
          ./target/release/installscope --version
          ./target/release/installscope --help

[package]
name = "installscope-report"
description = "Renders an analysis as SARIF 2.1.0, a self-contained HTML artifact, and PR-comment markdown."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
installscope-core = { workspace = true }
# For the version-diff renderer. Brings zstd transitively, which is documented in registry/Cargo.toml;
# the alternative was a second rendering home for the diff surfaces, and Architecture.md §5 puts all
# rendering here.
installscope-registry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

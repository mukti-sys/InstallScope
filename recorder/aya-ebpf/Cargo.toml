[package]
name = "installscope-ebpf"
description = "eBPF programs for the InstallScope aya backend. Builds only for bpfel-unknown-none on nightly."
version = "0.1.0"
edition = "2021"
publish = false

# Separate workspace from the product crates: this targets bpfel-unknown-none, is no_std, uses
# panic=abort, and requires nightly plus `-Z build-std=core`.
[workspace]

[dependencies]
# Pinned exactly to the versions proven by G1 run #33297876067 on kernel 6.17.0-1022-azure. aya-ebpf
# 0.2.1 exists and is deliberately not adopted: the proven version is the one that loaded, and
# Rules.md §5 asks for caution over confidence on kernel APIs. An upgrade earns its own gate run.
aya-ebpf = "=0.1.1"
installscope-abi = { path = "../../abi" }

[[bin]]
name = "installscope-ebpf"
path = "src/main.rs"

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1

[package]
name = "g1-ebpf"
version = "0.1.0"
edition = "2021"
publish = false

# Separate workspace from the loader: this crate targets bpfel-unknown-none, is no_std, uses
# panic=abort, and requires nightly + `-Z build-std=core`.
[workspace]

[dependencies]
# Pins reconciled against the passing G1 run #33297876067 (artifact `ebpf-Cargo.lock`). These are the
# versions that actually compiled for bpfel-unknown-none and loaded on ubuntu24 / kernel
# 6.17.0-1022-azure, so they are recorded facts rather than the earlier TODO-verify guesses.
#
# aya-ebpf 0.2.1 exists; 0.1.1 is kept deliberately. The proven version is the one that loaded, and
# Rules.md §5 asks for admitted uncertainty over plausible-looking changes on kernel APIs. Upgrading
# is a Phase 2 decision with its own verification run, not a drive-by bump.
aya-ebpf = "=0.1.1"
g1-common = { path = "../g1-common" }

[[bin]]
name = "g1-ebpf"
path = "src/main.rs"

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
